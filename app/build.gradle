plugins {
    id 'com.android.application'
}

// One version string; the version code follows from it (1.2.3 -> 10203). A test build can use
// another one: ./gradlew assembleRelease -PappVersion=0.9.0
def appVersion = (project.findProperty('appVersion') ?: '1.0.0').toString()
def versionParts = appVersion.tokenize('.').collect { it as int }
while (versionParts.size() < 3) versionParts << 0
def appVersionCode = versionParts[0] * 10000 + versionParts[1] * 100 + versionParts[2]

// The release key lives outside the repository. local.properties (never committed) points to a
// properties file with storeFile, storePassword, keyAlias and keyPassword:
//   infotablet.signing=/path/to/signing.properties
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def signingProps = null
def signingPath = localProps.getProperty('infotablet.signing')
if (signingPath && new File(signingPath).exists()) {
    signingProps = new Properties()
    new File(signingPath).withInputStream { signingProps.load(it) }
}

android {
    namespace = 'ba.infotablet'
    compileSdk = 36
    buildToolsVersion = '36.1.0'

    defaultConfig {
        applicationId = 'ba.infotablet'
        // Lenovo IdeaTab A3000-H runs Android 4.2.2 (API 17).
        minSdk = 17
        targetSdk = 36
        versionCode = appVersionCode
        versionName = appVersion
        // Public repository whose GitHub Releases carry the signed APK (checked for updates).
        buildConfigField 'String', 'UPDATE_REPO', '"Waiivyy/InfoTablet"'
        // The tablet is ARMv7 and mdpi; ship only what it can use.
        ndk { abiFilters 'armeabi-v7a' }
        vectorDrawables.generatedDensities = ['mdpi', 'hdpi']
    }

    signingConfigs {
        if (signingProps != null) {
            release {
                storeFile = new File(signingProps.getProperty('storeFile'))
                storePassword = signingProps.getProperty('storePassword')
                keyAlias = signingProps.getProperty('keyAlias')
                keyPassword = signingProps.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        release {
            // Without the key (another computer) the release build comes out unsigned.
            // -PreleaseWithDebugKey signs it with the debug key instead, to try the minified
            // build on a tablet that has a debug build installed.
            if (project.hasProperty('releaseWithDebugKey')) signingConfig = signingConfigs.debug
            else if (signingProps != null) signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }

    testOptions {
        // Date logic is tested in the tablet's time zone, whatever the build machine uses.
        unitTests.all { systemProperty 'user.timezone', 'Europe/Sarajevo' }
    }

    lint {
        disable 'OldTargetApi', 'GradleDependency', 'NewerVersionAvailable'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:-options']
}

dependencies {
    // Last OkHttp line that supports Android 4.x.
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    // 2.5.x is the last Conscrypt line with minSdk below 21.
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    // 1.15.3 is the newest jsoup without java.util.function / stream use (not on API 17).
    implementation 'org.jsoup:jsoup:1.15.3'
    // Wi-Fi page server (Java 6 bytecode, no newer Android APIs).
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    // QR codes. Only the QR encoder is used; it needs nothing newer than Android 4.2
    // (StandardCharsets appears only in the PDF417, Aztec and DataMatrix code, which is never loaded).
    implementation 'com.google.zxing:core:3.3.3'

    testImplementation 'junit:junit:4.13.2'
    // Real org.json on the JVM (android.jar only has stubs in unit tests).
    testImplementation 'org.json:json:20260814'
    // XmlPullParser implementation for feed parser tests on the JVM (Android itself uses kxml2).
    testImplementation 'net.sf.kxml:kxml2:2.3.0'
}
