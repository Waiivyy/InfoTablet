plugins {
    id 'com.android.application'
}

android {
    namespace = 'ba.infotablet'
    compileSdk = 36
    buildToolsVersion = '36.1.0'

    defaultConfig {
        applicationId = 'ba.infotablet'
        // Lenovo IdeaTab A3000-H runs Android 4.2.2 (API 17).
        minSdk = 17
        targetSdk = 36
        versionCode = 1
        versionName = '0.1.0'
        // The tablet is ARMv7 and mdpi; ship only what it can use.
        ndk { abiFilters 'armeabi-v7a' }
        vectorDrawables.generatedDensities = ['mdpi', 'hdpi']
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig = true
    }

    lint {
        disable 'OldTargetApi', 'GradleDependency', 'NewerVersionAvailable'
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:-options']
}

dependencies {
    // Last OkHttp line that supports Android 4.x.
    implementation 'com.squareup.okhttp3:okhttp:3.12.13'
    // 2.5.x is the last Conscrypt line with minSdk below 21.
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    // 1.15.3 is the newest jsoup without java.util.function / stream use (not on API 17).
    implementation 'org.jsoup:jsoup:1.15.3'

    testImplementation 'junit:junit:4.13.2'
}
